<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход — VRNHoney</title>
  <link rel="icon" href="images/favicon.svg?v=6" type="image/svg+xml">
  <link rel="stylesheet" href="styles/site.css?v=20260811j">
  <link rel="stylesheet" href="/css/shop-site.css?v=24">
</head>
<body class="shop-page">
<div class="menu-icon" id="menuToggle" role="button" tabindex="0" aria-label="Меню">☰</div>
  <nav id="mainNav" role="navigation">
    <div class="menu-items">
      <div class="menu-header">
        <p><img src="/images/VRNHoney-round.png" width="28" height="28" alt="Логотип VRNHoney"> VRNHoney</p>
      </div>
      <a href="/#tab1">Мёд в Воронеже</a>
      <a href="/#tab2">Галерея</a>
      <a href="/#tab3">Купить</a>
      <a class="lang-switch" href="/en/" hreflang="en" lang="en">EN</a>
      <a class="social-button" href="https://vk.com/vrnhoney_ru" target="_blank" rel="noopener">Сообщество</a>
            <a class="shop-nav-cart" href="/cart.html" aria-label="Корзина" title="Корзина"><svg class="shop-cart-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2zM7.2 14.4l.1.6c.1.6.6 1 1.2 1H19v-2H9.4l-.3-1.2L7.2 14.4zM7 4H4V2h3l.7 3H20c.6 0 1 .5.9 1.1l-1.2 6c-.1.6-.6 1-1.2 1H8.1L7 4zm1.4 3 .6 2.5h8.7l.8-2.5H8.4z"/></svg><span class="shop-badge" data-cart-count>0</span></a>
            <a class="shop-nav-account" href="/account.html" data-shop-account hidden>Кабинет</a>
            <a class="shop-nav-login" href="/login.html" data-shop-login>Войти</a>
    </div>
  </nav>
  <div id="menuOverlay" class="overlay" role="button" tabindex="0" aria-label="Закрыть меню"></div>

<div class="tab-content is-active">
    <div class="transparent-container">
      <div class="shop-auth">
        <h1 id="auth-title">Вход</h1>
        <div class="shop-auth__tabs" role="tablist">
          <button type="button" class="shop-auth__tab is-active" data-mode="login" aria-selected="true">Войти</button>
          <button type="button" class="shop-auth__tab" data-mode="register" aria-selected="false">Регистрация</button>
        </div>
        <div id="flash"></div>
        <form id="auth" class="shop-auth__form">
          <div class="shop-auth__extra" data-reg-only hidden>
            <label>Имя<input name="name" autocomplete="name"></label>
            <label>Телефон<input name="phone" type="tel" autocomplete="tel"></label>
          </div>
          <label data-email-row>Email<input type="email" name="email" required autocomplete="username"></label>
          <label data-pass-row>Пароль
            <span class="password-field">
              <input type="password" name="password" required minlength="6" autocomplete="current-password">
              <button type="button" class="password-field__toggle" aria-label="Показать пароль" aria-pressed="false" title="Показать пароль">
                <span class="password-field__label-show">Показать</span>
                <span class="password-field__label-hide">Скрыть</span>
              </button>
            </span>
          </label>
          <p class="shop-auth__forgot" data-login-only><button type="button" class="shop-auth__link" data-mode="forgot">Забыли пароль?</button></p>
          <p class="shop-auth__back" data-forgot-only hidden><button type="button" class="shop-auth__link" data-mode="login">Назад ко входу</button></p>
          <p><button class="shop-btn shop-auth__submit" type="submit">Войти</button></p>
        </form>
      </div>
    </div>
  </div>
  <script src="scripts/site.js?v=20260811j" defer></script>
  <script type="module">
    import { api, refreshNav, bindPasswordToggles } from '/js/shop.js?v=8';
    bindPasswordToggles();
    const user0 = await refreshNav();
    const params = new URLSearchParams(location.search);
    const resetToken = params.get('reset') || '';
    if (!resetToken) {
      if (user0?.is_admin) location.href = '/admin/';
      if (user0 && !user0.is_admin) location.href = '/cart.html';
    }

    const flash = document.getElementById('flash');
    const form = document.getElementById('auth');
    const title = document.getElementById('auth-title');
    const submitBtn = form.querySelector('.shop-auth__submit');
    const extra = form.querySelector('[data-reg-only]');
    const passRow = form.querySelector('[data-pass-row]');
    const emailRow = form.querySelector('[data-email-row]');
    const passInput = form.querySelector('[name="password"]');
    const tabs = document.querySelector('.shop-auth__tabs');
    let mode = resetToken ? 'reset' : 'login';

    function setMode(next) {
      mode = next;
      const isReg = mode === 'register';
      const isForgot = mode === 'forgot';
      const isReset = mode === 'reset';
      title.textContent = isReset ? 'Новый пароль' : isForgot ? 'Восстановление' : isReg ? 'Регистрация' : 'Вход';
      submitBtn.textContent = isReset ? 'Сохранить пароль' : isForgot ? 'Отправить ссылку' : isReg ? 'Создать аккаунт' : 'Войти';
      extra.hidden = !isReg;
      if (tabs) tabs.hidden = isForgot || isReset;
      if (emailRow) emailRow.hidden = isReset;
      if (passRow) passRow.hidden = isForgot;
      passInput.required = !isForgot;
      passInput.autocomplete = isReg || isReset ? 'new-password' : 'current-password';
      form.querySelectorAll('[data-login-only]').forEach((el) => { el.hidden = mode !== 'login'; });
      form.querySelectorAll('[data-forgot-only]').forEach((el) => { el.hidden = !isForgot; });
      document.querySelectorAll('.shop-auth__tab').forEach((btn) => {
        const on = btn.dataset.mode === mode;
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      if (!isReset) flash.innerHTML = '';
    }

    document.querySelectorAll('[data-mode]').forEach((btn) => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });
    setMode(mode);
    if (resetToken) {
      flash.innerHTML = '<div class="shop-flash ok">Придумайте новый пароль (не меньше 6 символов).</div>';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      try {
        if (mode === 'forgot') {
          const data = await api('/auth/forgot', { method: 'POST', body: { email: fd.get('email') } });
          flash.innerHTML = `<div class="shop-flash ok">${data.message || 'Проверьте почту'}</div>`;
          return;
        }
        if (mode === 'reset') {
          const data = await api('/auth/reset', {
            method: 'POST',
            body: { token: resetToken, password: fd.get('password') },
          });
          flash.innerHTML = `<div class="shop-flash ok">${data.message || 'Пароль обновлён'}</div>`;
          history.replaceState({}, '', '/login.html');
          setMode('login');
          return;
        }
        const body = mode === 'register'
          ? {
              name: fd.get('name'),
              phone: fd.get('phone'),
              email: fd.get('email'),
              password: fd.get('password'),
            }
          : { email: fd.get('email'), password: fd.get('password') };
        const data = await api(mode === 'register' ? '/auth/register' : '/auth/login', {
          method: 'POST',
          body,
        });
        if (data.user?.is_admin) {
          location.href = '/admin/';
          return;
        }
        location.href = '/cart.html';
      } catch (err) {
        flash.innerHTML = `<div class="shop-flash err">${err.message}</div>`;
      }
    });
  </script>
<footer class="footer">
  <span class="footer-row"><a href="/offer.html">Оферта</a></span>
  <span class="footer-dot" aria-hidden="true">·</span>
  <span class="footer-row footer-row--dev">
    <span class="footer-label">Разработчик:</span>
    <a href="https://www.serpmonn.ru" target="_blank" rel="noopener"><span style="color: red;">Serp</span><span style="color: black;">monn</span></a>
  </span>
</footer>
</body>
</html>
